<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Rich Amber-Gold Gradient -->
    <linearGradient id="kaiaFaviconGold" x1="35" y1="10" x2="110" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="50%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="kaiaCircuitGlow" x1="15" y1="95" x2="45" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#FDE68A" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="120" height="120" rx="28" fill="#0B0F19"/>

  <g filter="url(#subtleShadow)">
    <!-- 1. Left Vertical Pillar -->
    <path d="M26 20 H46 V100 H26 Z" fill="#1E293B" rx="2" />

    <!-- 2. Top-Right Diagonal Arm (Amber Gold) -->
    <path d="M48 50 L78 20 H104 L64 60 H48 Z" fill="url(#kaiaFaviconGold)" />

    <!-- 3. Bottom-Right Diagonal Leg -->
    <path d="M58 56 L102 100 H74 L46 72 V56 H58 Z" fill="#1E293B" />

    <!-- 4. PCB Circuit Traces inside the pillar -->
    <path d="M33 94 V65 L41 57 V44" stroke="url(#kaiaCircuitGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="33" cy="94" r="3.2" fill="#FBBF24" />
    <circle cx="33" cy="94" r="1.5" fill="#0B0F19" />
    <circle cx="41" cy="44" r="2.2" fill="#FBBF24" />

    <path d="M39 88 V74 L34 69 V62" stroke="url(#kaiaCircuitGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="39" cy="88" r="2.2" fill="#FBBF24" />
    <circle cx="34" cy="62" r="2" fill="#FBBF24" />

    <!-- Top highlight line -->
    <path d="M80 22 L102 22 L66 58" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>